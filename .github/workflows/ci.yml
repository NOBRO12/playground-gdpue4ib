name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -q

      - name: Reproduce worked example (rejection path)
        run: |
          python examples/worked_example_artifacts/generate_fixtures.py
          python -m trading_agent init-db
          python -m trading_agent improve --dry-run \
              --fixture-proposal examples/worked_example_artifacts/proposal.json
